# Denver → Ouray over the Continental Divide (US 285, US 50, US 550).
#
# Every stop needs a name and lat/lon. Everything else is optional. `photos` pins
# files from images/<photo_query slug>/ (pick them with --photo-sheets). The leg *into*
# a stop (road name, miles, drive time, shaping points, drive caption and fact)
# lives on that stop. See README.md for the full field list.

title = "Denver to Ouray"
series = "Colorado Road Trips"
region = "Central Colorado"
days = "2 to 3"
best_season = "Late June to early October"
# Short punchy lines for the "coming up" hook at the start. Each one is paired
# with the stop named after the colon, whose photo plays behind it.
hook = [
  "Over the Continental Divide at 11,312 ft : Monarch Pass",
  "Colorado's largest body of water : Blue Mesa Reservoir",
  "A hot-springs town walled in by 13,000-foot peaks : Ouray",
]
tips = [
  "Fill up in Buena Vista, Salida, Gunnison and Montrose. Gaps between pumps get long.",
  "Monarch Pass can see snow in any month. Check COtrip.org before you go.",
  "Leave Denver early on Fridays. US 285 backs up with weekend traffic.",
]

[inset]
name = "Colorado"
bounds = [-109.05, 37.0, -102.04, 41.0]   # west, south, east, north
city = { name = "Denver", lat = 39.7392, lon = -104.9903 }

[up_next]
title = "The Million Dollar Highway"
subtitle = "Ouray to Silverton"
miles = 24

# ---------------------------------------------------------------------------

[[stops]]
name = "Denver"
lat = 39.7392
lon = -104.9903
elevation_ft = 5280
tag = "START"
photo_query = "Denver skyline"
photos = ["pixabay-2228782.jpg", "wikimedia-73793552.jpg"]
caption = "We start in Denver, exactly one mile high, and point the car southwest on US 285."
fact = "The 13th step of the State Capitol sits at 5,280 ft. Look for the engraved marker."
[stops.info]
"SEE & DO" = "Union Station and the Capitol's mile-high step."
"TIP" = "Gas and snacks here. The first real town is an hour out."

