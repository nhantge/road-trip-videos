# The Million Dollar Highway: US 550 from Ouray to Silverton over Red Mountain Pass.
#
# See README.md for every field. `sights` are "worth a stop" detours on the drive
# into a stop: each gets its own photo, an on-screen tip and (with lat/lon) a map marker.

title = "The Million Dollar Highway"
series = "Colorado Road Trips"
region = "San Juan Mountains"
days = "1"
best_season = "June to early October"
hook = [
  "A highway that crosses right over a waterfall : Bear Creek Falls",
  "11,018 feet, sheer drops, barely a guardrail : Red Mountain Pass",
  "A whole town that's a National Historic Landmark : Silverton",
]
tips = [
  "There's no gas between Ouray and Silverton. Fill up before you go.",
  "Use the pullouts for photos and let faster traffic by. Never stop in a curve.",
  "Snow can close Red Mountain Pass outside summer. Check COtrip.org first.",
  "Give it a full day: the drive is an hour, the stops are the fun part.",
]

[narration]
hook = "Get ready for one of the most jaw-dropping drives in America! A highway that crosses right over a waterfall. A mountain pass at eleven thousand feet with barely a guardrail. And a whole town that's a National Historic Landmark!"
intro = "This is the Million Dollar Highway: just 24 miles, but every single one is a showstopper. And stick around, because the full trip planner is waiting at the end!"
overview = "Here's the game plan! We start in Ouray, stop at Bear Creek Falls, climb over Red Mountain Pass, and roll into Silverton. Let's go!"
finale = "And that's it! 24 incredible miles, from Ouray all the way to Silverton, topping out at 11,018 feet on Red Mountain Pass."
planner = "Okay, here's everything you need to plan this drive yourself. Pause right here and grab a screenshot!"
end = "Thanks so much for riding along! Hit subscribe, and I'll see you on the road to Durango!"

