# Colorado National Monument: Rim Rock Drive from Fruita to Grand Junction.
# Open year-round; spring and fall are the best months.

title = "Colorado National Monument"
series = "Colorado Road Trips"
region = "Grand Valley"
days = "1"
best_season = "Spring and fall"
rim_road = true
