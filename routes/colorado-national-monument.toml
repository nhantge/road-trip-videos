  "Canyon drop-offs right beside the road : Cold Shivers Point",
  "Desert bighorn sheep on the roadside : Saddlehorn",
]
tips = [
  "There's an entrance fee, or use an America the Beautiful pass.",
  "Turn your headlights on in the three tunnels, and share the road with cyclists.",
  "Bring water. There's no food or gas on Rim Rock Drive.",
  "Summer afternoons are hot. Drive early, or come in spring and fall.",
]

[narration]
hook = "This one is pure red rock canyon country! A four-hundred-fifty-foot sandstone tower standing all by itself. Canyon drop-offs right beside the road. And desert bighorn sheep just hanging out!"
intro = "This is Colorado National Monument: Rim Rock Drive, 23 miles right along the edge of the canyons, between Fruita and Grand Junction. Stick around till the end for the full trip planner!"
overview = "Here's the plan! We leave Fruita, climb up to the Saddlehorn visitor center, see Independence Monument, peek over Cold Shivers Point, and roll down into Grand Junction!"
finale = "And that's the drive! 29 miles from Fruita to Grand Junction, with 23 of them on Rim Rock Drive, right along the canyon rims."
planner = "Here's your trip planner, everything in one place. Pause and grab a screenshot!"
end = "Thanks for riding along! Hit subscribe, and next time we're heading south to the tallest sand dunes in North America!"

